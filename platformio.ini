[platformio]
src_dir = C:\Users\aakoz\Documents\GitHub\AutoSamPIO\AutoSam
data_dir = C:\Users\aakoz\Documents\GitHub\AutoSamPIO\AutoSam\data

[env:esp12e]
platform = espressif8266
board = esp12e
framework = arduino
upload_protocol = espota
upload_port = 192.168.1.5
monitor_port = socket://192.168.1.5:23
board_build.filesystem = littlefs
lib_deps = 
	gyverlibs/GyverFilters@^3.2
	gyverlibs/GyverNTP@^1.3.1
