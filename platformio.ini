; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
; pio device list --mdns

[platformio]
src_dir = AutoSam
data_dir = AutoSam\data

[env:NodeMCU]
platform = espressif8266
board = esp12e
framework = arduino
upload_protocol = espota
upload_port = 192.168.1.5
monitor_port = socket://192.168.1.5:23
board_build.filesystem = littlefs
board_build.f_cpu = 160000000L
lib_deps = 
	gyverlibs/GyverNTP@^2.2.2
	bitbucket-christandlg/BMx280MI@^1.2.3
	gyverlibs/GyverFilters@^3.2
	tzapu/WiFiManager@^2.0.17
	marcoschwartz/LiquidCrystal_I2C@^1.1.4
	gyverlibs/microDS18B20@^3.10
