; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = \AutoSam
data_dir = \AutoSam\data
default_envs = NodeMCU

[env]
framework = arduino

[env:NodeMCU]
platform = espressif8266
board = esp12e
upload_protocol = espota
upload_port = 192.168.1.5
monitor_port = socket://192.168.1.5:23
board_build.filesystem = littlefs
board_build.f_cpu = 160000000L
lib_deps = 
	gyverlibs/GyverNTP@^2.2.2
	gyverlibs/GyverFilters@^3.2
	gyverlibs/GyverDS18@^1.1.2
	gyverlibs/GyverIO@^1.3.10
	bitbucket-christandlg/BMx280MI@^1.2.3
	tzapu/WiFiManager@^2.0.17
	paulstoffregen/OneWire@^2.3.8
	marcoschwartz/LiquidCrystal_I2C@^1.1.4
build_flags = -D NodeMCU

[env:ESP32]
platform = espressif32
board = esp32dev
build_flags = -D ESP32dev


;
;
;src_dir = \AutoSam
;data_dir = \AutoSam\data
;