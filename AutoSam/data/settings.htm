<!DOCTYPE html>
<html>

<head>
    <meta http-equiv="Content-type" content="text/html; charset=utf-8">
    <title>AutoSam</title>
    <link rel="stylesheet" href="style.css">
    <script src="/head.js"></script>
    <script src="/settings.js"></script>
</head>

<BODY onload=" process() ">

    <!-- вставка -->
    <div w3-include-html="head.htm"></div>
    <script>
        includeHTML();
    </script>
    <!-- /вставка -->

    <div>
        <br>
        <table class="details">
            <tr>
                <td> Режим</td>
                <td> <input type="number" id="MODE" min="1" max="3" step="1" size="2"></td>
            </tr>
            <tr>
                <td> Минимальная температур</td>
                <td> <input type="number" id="MINT" value="78" min="0" max="100" step="0.5" size="2"> </td>
            </tr>
            <tr>
                <td> Макс температура бака</td>
                <td> <input type="number" id="MAXT" value="98" min="70" max="100" step="0.5" size="2"></td>
            </tr>
            <tr>
                <td> Макс температура пара</td>
                <td> <input type="number" id="MAXS" value="90" min="70" max="100" step="0.5" size="2"></td>
            </tr>
            <tr>
                <td> Скорость изменения температуры</td>
                <td> <input type="number" id="HEATR" value="1" min="0" max="3" step="0.1" size="2"></td>
            </tr>
            <tr>
                <td align="left"> <input type="submit" name="reset" value=" Reset " onclick="sendbutton(42)"> </td>
                <td align="left"> <input type="submit" name="Reload" value=" Обновить " onclick="load_once()"> </td>

            </tr>
            <tr>
                <td align="left"> <input type="submit" name="init_sens" value=" Init Sensors" onclick="sendbutton(41);"></td>
                <td align="left"> <input type="submit" name="Set" value=" Сохранить " onclick="SendForm()"> </td>
            </tr>
        </table>

        <br>
        <div class="copyright">
            Использованы материалы сайта <a href="http://ESP8266-ArduinoIDE.ru" target="_blank">ESP8266-ArduinoIDE.ru</a>
        </div>
    </div>




</body>

<script>
    load_once();
</script>

</html>
