<!DOCTYPE html>
<html>

<head>
    <meta http-equiv="Content-type" content="text/html; charset=utf-8">
    <title>AutoSam</title>
    <link rel="stylesheet" href="style.css">
    <script src="/settings.js"></script>
</head>

<BODY onload="process();">
    <!-- вставка -->
    <div w3-include-html="head.htm"></div>
    <script>
        includeHTML();
    </script>
    <!-- /вставка -->
    <div>

        <br>
        <table class="details">
            <caption>Настройки</caption>
            <tr>
                <td>Режим </td>
                </td>
                <td><output id="MODEI"></td>
	<td ><input type="number" id="MODE"  value="1"min="1" max="3" step="1" size="1"></td>
	<td  ><input type="submit" name="Set" value=" SET " onclick="SetMD()"></td>
</tr>
<tr>
<td colspan="4" align="left"> 1 - ректификация; 2 - дистилляция; 3 - погода. </td>
</tr>

<tr>
	<td>Минимальная температура</td>
	<td><output  id="BOILI" ></td>
	<td ><input type="number" id="BOIL" value="80" min="0" max="100" step="0.5" size="2"></td>
	<td  ><input type="submit" name="Set" value=" SET " onclick="SetMB()"></td>
</tr>
<tr>
	<td>Макс температура бака</td>
	<td><output  id="MTANKI" ></td>
	<td ><input type="number" id="MTANK" value="95" min="0" max="100" step="0.5" size="2"></td>
	<td  ><input type="submit" name="Set" value=" SET " onclick="SetMT()"></td>
</tr>

<tr>
	<td>Макс температура пара</td>
	<td><output  id="STMAXI" ></td>
	<td ><input type="number" id="STMAX" value="80" min="70" max="100" step="0.5" size="2"></td>
	<td  ><input type="submit" name="Set" value=" SET " onclick="SetSM()"></td>
</tr>

<tr>
	<td>Скорость изменения температуры </td>
	<td><output  id="DELT0I" ></td>
	<td ><input type="number" id="DELT0" value="1" min="0" max="3" step="0.1" size="2"></td>
	<td  ><input type="submit" name="Set" value=" SET " onclick="SetD0()"></td>
</tr>
<tr>
<td colspan="2" align="left"> <input type="submit" name="init sensors 1" value=" Init sensors " onclick="Seti()"> </td>
</tr>
<tr>
<td input type="submit" name="init_sens" value=" Init Sensors 2" onclick="sendbutton(41);"></td>
</tr>
<tr>
<td colspan="4" align="left"> <input type="submit" name="reset" value=" Reset " onclick="sendbutton(42)"> </td>
</tr>
</table>

<br>
<div class="copyright"> 
Использованы материалы сайта  <a href="http://ESP8266-ArduinoIDE.ru" target="_blank">ESP8266-ArduinoIDE.ru</a>

</div></body></html>
